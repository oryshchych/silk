# ─────────────────────────────────────────────────────────────────────────
# БАЗА для розгорнутих середовищ (staging і production).
#
# Три стеки, як вимагає ENVIRONMENTS.md:
#   local      — docker-compose.local.yml (окремий файл, не оверлей)
#   staging    — docker compose -f docker-compose.yml -f docker-compose.staging.yml
#   production — docker compose -f docker-compose.yml -f docker-compose.production.yml
#
# Staging і production живуть на тому ж VPS як ОКРЕМІ compose-проєкти
# (різні `name`) з ОКРЕМИМИ volume. Розгортання через Dokploy:
# git push -> build -> deploy.
#
# ADR-10: на обидва середовища їде ОДИН image digest із різними .env.
# Тому тут немає жодного значення, специфічного для середовища —
# воно приходить зі змінних оточення (Dokploy: .env проєкту).
#
# Caddy не описаний: його бере на себе Dokploy (він же керує сертифікатами).
# Параметри Postgres (`command`) задаються в оверлеї повністю, а не
# частково: перевизначення списку замінює його цілком, тому «половинчаста»
# конфігурація неможлива за побудовою.
# ─────────────────────────────────────────────────────────────────────────

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      # standalone-білд Next.js: output: 'standalone' у next.config.ts.
      # NEXT_PUBLIC_SITE_URL вшивається під час збірки (ADR-10).
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    restart: unless-stopped
    depends_on:
      # Сайт стартує лише після УСПІШНИХ міграцій: нова версія коду не
      # бачить старої схеми.
      migrate:
        condition: service_completed_successfully
    # ЯВНИЙ перелік змінних (allowlist), а не env_file: Dokploy тримає все в
    # одному .env, а web НЕ мусить отримати пароль суперкористувача,
    # міграційної ролі чи креденшели бекапів — інакше один скомпрометований
    # процес знищує і схему, і резервні копії. Порожнє значення = не задано
    # (packages/shared/src/env.schema.ts).
    environment:
      NODE_ENV: production
      APP_ENV: ${APP_ENV:?APP_ENV обов'язковий}
      # store_app: DML на потрібних таблицях, БЕЗ DDL і без DROP.
      # НЕ POSTGRES_USER, якого офіційний образ робить суперкористувачем.
      DATABASE_URL: postgres://${POSTGRES_APP_USER}:${POSTGRES_APP_PASSWORD}@postgres:5432/${POSTGRES_DB}
      EMAIL_TO_OVERRIDE: ${EMAIL_TO_OVERRIDE:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      AUTH_SECRET: ${AUTH_SECRET:-}
      MONO_PLATA_TOKEN: ${MONO_PLATA_TOKEN:-}
      WAYFORPAY_MERCHANT_ACCOUNT: ${WAYFORPAY_MERCHANT_ACCOUNT:-}
      WAYFORPAY_SECRET_KEY: ${WAYFORPAY_SECRET_KEY:-}
      NOVA_POSHTA_API_KEY: ${NOVA_POSHTA_API_KEY:-}
      UKRPOSHTA_API_KEY: ${UKRPOSHTA_API_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_MEDIA: ${R2_BUCKET_MEDIA:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      STAGING_BASIC_AUTH_USER: ${STAGING_BASIC_AUTH_USER:-}
      STAGING_BASIC_AUTH_PASSWORD: ${STAGING_BASIC_AUTH_PASSWORD:-}
      STAGING_BASIC_AUTH_EXCLUDE: ${STAGING_BASIC_AUTH_EXCLUDE:-}
    healthcheck:
      # node, не wget: у node:24-slim немає wget/curl (apps/web/Dockerfile).
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    labels:
      # Dokploy/Traefik підхопить домен звідси
      - 'traefik.enable=true'

  # Одноразовий: застосовує міграції роллю store_migrate і завершується.
  # Перезапускається на кожному `up` (деплої); вже застосовані міграції
  # пропускає журнал drizzle. Seed — тим самим образом:
  #   docker compose run --rm -w /repo/packages/db \
  #     -e APP_ENV=staging -e EMAIL_TO_OVERRIDE=... -e DATABASE_URL=<store_app> \
  #     migrate node --import tsx seed/index.ts
  migrate:
    build:
      context: .
      dockerfile: packages/db/Dockerfile
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_MIGRATE_URL: postgres://${POSTGRES_MIGRATE_USER}:${POSTGRES_MIGRATE_PASSWORD}@postgres:5432/${POSTGRES_DB}

  # Щоденний pg_dump у Cloudflare R2 з перевіркою, що файл читається
  # (infra/dump). Власні креденшели й ОКРЕМИЙ bucket: web їх не отримує.
  # Без R2_* деплой не падає — бекап пише помилку в лог контейнера.
  # Негайний бекап: docker exec <контейнер dump> backup-now
  dump:
    build:
      context: ./infra/dump
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB}
      # Суперкористувач: pg_dump мусить читати всі схеми, включно з pgboss.
      PGUSER: ${POSTGRES_SUPERUSER}
      PGPASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      R2_S3_ENDPOINT: ${R2_S3_ENDPOINT:-}
      R2_BUCKET_BACKUPS: ${R2_BUCKET_BACKUPS:-}
      R2_BACKUP_ACCESS_KEY_ID: ${R2_BACKUP_ACCESS_KEY_ID:-}
      R2_BACKUP_SECRET_ACCESS_KEY: ${R2_BACKUP_SECRET_ACCESS_KEY:-}

  # worker (pg-boss: cron і черги) — той самий репозиторій, інший entrypoint.
  # Тимчасово НЕ описаний: apps/worker ще немає, і compose з неіснуючим
  # Dockerfile не підніметься. Повертається разом із кодом воркера
  # (фаза 0.5): build apps/worker/Dockerfile, depends_on postgres,
  # DATABASE_URL роллю store_app, env_file [.env.worker] — окремий від web
  # набір секретів. Повний попередній блок — в історії git цього файла.

  postgres:
    # НЕ офіційний образ: потрібен український hunspell-словник у
    # $SHAREDIR/tsearch_data і pgBackRest у тому ж контейнері
    # (archive_command виконує сервер БД). Деталі — infra/postgres/Dockerfile.
    build:
      context: ./infra/postgres
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_MIGRATE_USER: ${POSTGRES_MIGRATE_USER}
      POSTGRES_MIGRATE_PASSWORD: ${POSTGRES_MIGRATE_PASSWORD}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
      POSTGRES_BOSS_USER: ${POSTGRES_BOSS_USER}
      POSTGRES_BOSS_PASSWORD: ${POSTGRES_BOSS_PASSWORD}
      # ICU, а не libc: заявлене українське сортування (Ґ, Є, І, Ї) дає
      # саме ICU. Змінити після створення volume вже неможливо —
      # тільки міграція даних у нову БД.
      POSTGRES_INITDB_ARGS: '--locale-provider=icu --icu-locale=uk-UA --encoding=UTF8'
    volumes:
      # У 18+ образ тримає дані в /var/lib/postgresql/<major>/docker, тому
      # том монтується на /var/lib/postgresql (mount на .../data — помилка).
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_SUPERUSER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
    # НЕ публікувати порт назовні. Доступ лише всередині docker-мережі.
    # Для psql: docker compose exec postgres psql

volumes:
  pgdata:
