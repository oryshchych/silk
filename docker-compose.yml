# ─────────────────────────────────────────────────────────────────────────
# БАЗА для розгорнутих середовищ (staging і production).
#
# Три стеки, як вимагає ENVIRONMENTS.md:
#   local      — docker-compose.local.yml (окремий файл, не оверлей)
#   staging    — docker compose -f docker-compose.yml -f docker-compose.staging.yml
#   production — docker compose -f docker-compose.yml -f docker-compose.production.yml
#
# Staging і production живуть на тому ж VPS як ОКРЕМІ compose-проєкти
# (різні `name`) з ОКРЕМИМИ volume. Розгортання через Dokploy:
# git push -> build -> deploy.
#
# ADR-10: на обидва середовища їде ОДИН image digest із різними .env.
# Тому тут немає жодного значення, специфічного для середовища —
# воно приходить із env_file.
#
# Caddy не описаний: його бере на себе Dokploy (він же керує сертифікатами).
# Параметри Postgres (`command`) задаються в оверлеї повністю, а не
# частково: перевизначення списку замінює його цілком, тому «половинчаста»
# конфігурація неможлива за побудовою.
# ─────────────────────────────────────────────────────────────────────────

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      # standalone-білд Next.js: output: 'standalone' у next.config.ts
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # store_app: DML на потрібних таблицях, БЕЗ DDL і без DROP.
      # НЕ POSTGRES_USER, якого офіційний образ робить суперкористувачем —
      # компрометація web давала б можливість знищити схему.
      DATABASE_URL: postgres://${POSTGRES_APP_USER}:${POSTGRES_APP_PASSWORD}@postgres:5432/${POSTGRES_DB}
    # ОКРЕМИЙ env-набір. web НЕ отримує креденшелів бекапів:
    # інакше один скомпрометований процес знищує і дані, і резервні копії.
    env_file: [.env.web]
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    labels:
      # Dokploy/Traefik підхопить домен звідси
      - 'traefik.enable=true'

  # Той самий репозиторій, інший entrypoint. Моноліт із двох процесів.
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_APP_USER}:${POSTGRES_APP_PASSWORD}@postgres:5432/${POSTGRES_DB}
    env_file: [.env.worker]

  postgres:
    # НЕ офіційний образ: потрібен український hunspell-словник у
    # $SHAREDIR/tsearch_data і pgBackRest у тому ж контейнері
    # (archive_command виконує сервер БД). Деталі — infra/postgres/Dockerfile.
    build:
      context: ./infra/postgres
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_MIGRATE_USER: ${POSTGRES_MIGRATE_USER}
      POSTGRES_MIGRATE_PASSWORD: ${POSTGRES_MIGRATE_PASSWORD}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
      POSTGRES_BOSS_USER: ${POSTGRES_BOSS_USER}
      POSTGRES_BOSS_PASSWORD: ${POSTGRES_BOSS_PASSWORD}
      # ICU, а не libc: заявлене українське сортування (Ґ, Є, І, Ї) дає
      # саме ICU. Змінити після створення volume вже неможливо —
      # тільки міграція даних у нову БД.
      POSTGRES_INITDB_ARGS: '--locale-provider=icu --icu-locale=uk-UA --encoding=UTF8'
    volumes:
      # У 18+ образ тримає дані в /var/lib/postgresql/<major>/docker, тому
      # том монтується на /var/lib/postgresql (mount на .../data — помилка).
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_SUPERUSER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
    # НЕ публікувати порт назовні. Доступ лише всередині docker-мережі.
    # Для psql: docker compose exec postgres psql

volumes:
  pgdata:
