# ─────────────────────────────────────────────────────────────────────────
# PRODUCTION. Оверлей до docker-compose.yml.
#
#   docker compose -f docker-compose.yml -f docker-compose.production.yml up -d
#
# Той самий image digest, що перевірений на staging (ADR-10). Промоушен —
# зміна .env, не новий білд.
# ─────────────────────────────────────────────────────────────────────────
name: store-production

services:
  web:
    deploy:
      resources:
        limits:
          memory: 1024M

  worker:
    deploy:
      resources:
        limits:
          memory: 512M

  postgres:
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - work_mem=16MB
      - -c
      - max_connections=100
      # Для аналізу повільних запитів на фазах 1 і 10
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - log_min_duration_statement=500
      # Безперервне архівування WAL у R2. Щоденного pg_dump недостатньо:
      # він дає RPO до 24 годин, а «диск помер о 23:00» означає втрачений
      # день замовлень при тому, що гроші в еквайрі є.
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=pgbackrest --stanza=store archive-push %p
      - -c
      - archive_timeout=300
    volumes:
      - ./infra/postgres/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
    env_file: [.env.backup]
    deploy:
      resources:
        limits:
          memory: 2048M

  # Бекапи: pgBackRest із безперервним архівуванням WAL у Cloudflare R2.
  #
  # Розклад: full раз на тиждень, differential щодня, WAL безперервно.
  # Раз на місяць — відновлення на чистий інстанс, включно з PITR (фаза 12).
  # Бекап, який ніколи не розвертали, не існує.
  backup:
    build:
      context: ./infra/backup
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Власні креденшели й ОКРЕМИЙ bucket: видалення копій не має бути
    # доступне тому самому ключу, що їх створює.
    env_file: [.env.backup]
    environment:
      PGBACKREST_STANZA: store
      PGBACKREST_REPO1_TYPE: s3
      PGBACKREST_REPO1_S3_ENDPOINT: ${R2_S3_ENDPOINT}
      PGBACKREST_REPO1_S3_BUCKET: ${R2_BUCKET_BACKUPS}
      PGBACKREST_REPO1_RETENTION_FULL: 4
    volumes:
      - ./infra/postgres/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
      # У 18+ образ тримає дані в /var/lib/postgresql/<major>/docker, тому
      # том монтується на /var/lib/postgresql (mount на .../data — помилка).
      - pgdata:/var/lib/postgresql
