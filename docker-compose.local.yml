# ─────────────────────────────────────────────────────────────────────────
# LOCAL. Окремий стек, не оверлей: локально web і worker запускаються на
# хості (`turbo dev`), тому контейнеризувати їх нема сенсу — HMR через
# bind-mount повільніший і ламається на різних архітектурах.
#
#   pnpm dev        # піднімає цей стек і застосунок однією командою
#   pnpm dev:db     # тільки БД + Mailpit
#
# Порт БД публікується (54322, не 5432) — щоб drizzle-kit, psql і
# Testcontainers з хоста бачили її, і щоб не конфліктувати з локально
# встановленим Postgres.
# ─────────────────────────────────────────────────────────────────────────
name: store-local

services:
  postgres:
    build:
      context: ./infra/postgres
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-store_root}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-store_root}
      POSTGRES_DB: ${POSTGRES_DB:-store}
      POSTGRES_MIGRATE_USER: ${POSTGRES_MIGRATE_USER:-store_migrate}
      POSTGRES_MIGRATE_PASSWORD: ${POSTGRES_MIGRATE_PASSWORD:-store_migrate}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-store_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-store_app}
      POSTGRES_BOSS_USER: ${POSTGRES_BOSS_USER:-store_boss}
      POSTGRES_BOSS_PASSWORD: ${POSTGRES_BOSS_PASSWORD:-store_boss}
      # ICU, а не libc: заявлене українське сортування (Ґ, Є, І, Ї) дає
      # саме ICU. Змінити після створення volume вже неможливо —
      # тільки перестворення БД.
      POSTGRES_INITDB_ARGS: '--locale-provider=icu --icu-locale=uk-UA --encoding=UTF8'
    ports:
      - '54322:5432'
    volumes:
      # Монтування в /var/lib/postgresql, а не в .../data: у 18+ офіційний
      # образ тримає дані в підкаталозі з номером мажора, щоб працював
      # pg_upgrade --link. Мount на .../data образ вважає помилкою й падає.
      - pgdata_local:/var/lib/postgresql
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_SUPERUSER:-store_root} -d ${POSTGRES_DB:-store}']
      interval: 5s
      timeout: 5s
      retries: 10
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - work_mem=8MB
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - log_min_duration_statement=200

  # Локально листи нікуди не виходять — Mailpit ловить усе на :8025.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - '8025:8025'
      - '1025:1025'

volumes:
  pgdata_local:
