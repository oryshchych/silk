# pgBackRest: безперервне архівування WAL + періодичні бекапи в Cloudflare R2.
#
# СЕКРЕТІВ ТУТ НЕМАЄ. Ключі приходять змінними середовища з .env.backup
# (PGBACKREST_REPO1_S3_KEY, PGBACKREST_REPO1_S3_KEY_SECRET) — файл
# монтується read-only і потрапляє в образ, тому ключ у ньому означав би
# ключ у git.
#
# Окремий bucket і окремі креденшели від R2 для медіа: видалення копій не
# має бути доступне тому самому ключу, що їх створює.

[global]
repo1-type=s3
# R2 сумісний з S3 API, але вимагає path-style URI.
repo1-s3-uri-style=path
repo1-path=/store
repo1-retention-full=4
repo1-retention-diff=7
compress-type=zst
compress-level=6
process-max=2
start-fast=y
# Асинхронне архівування: archive_command не має ставати вузьким місцем
# для транзакцій, які пишуть гроші.
archive-async=y
spool-path=/var/spool/pgbackrest
log-level-console=info
log-level-file=detail

[store]
# У 18+ офіційний образ тримає дані в підкаталозі з номером мажора.
pg1-path=/var/lib/postgresql/18/docker
pg1-port=5432
pg1-user=postgres
